name: Managed ag-psd Package

on:
  pull_request:
    paths:
      - "packaging/ag-psd-engine/**"
      - "tools/build_ag_psd_managed_package.py"
      - "crates/yu-engine-manager/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/build_cli_candidate.py"
      - "crates/yu-cli/**"
      - "crates/yu-core/**"
      - "crates/yu-engine-api/**"
      - "crates/yu-capability-psd/**"
      - "crates/yu-runtime-psd/**"
      - "crates/yu-psd-spike/adapters/typescript/ag_psd_protocol.cjs"
      - ".github/workflows/ag-psd-managed-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package + install smoke / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            target_os: linux
            target_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            binary_name: yu
          - label: macos-aarch64
            runner: macos-latest
            target_os: macos
            target_arch: aarch64
            rust_target: aarch64-apple-darwin
            binary_name: yu
          - label: windows-x86_64
            runner: windows-latest
            target_os: windows
            target_arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            binary_name: yu.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.3"

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Install pinned package dependencies
        working-directory: packaging/ag-psd-engine
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build verified self-contained package
        run: >-
          python tools/build_ag_psd_managed_package.py build
          --sources packaging/ag-psd-engine/node-runtime-sources-v1.json
          --target-os ${{ matrix.target_os }}
          --target-arch ${{ matrix.target_arch }}
          --node-modules packaging/ag-psd-engine/node_modules
          --protocol-adapter crates/yu-psd-spike/adapters/typescript/ag_psd_protocol.cjs
          --output-dir target/ag-psd-managed/${{ matrix.label }}
          --package-base-url https://example.invalid/yu-tool/ag-psd-engine-export-v2

      - name: Install, activate, execute private runtime, and discover engine
        run: >-
          cargo run --locked -p yu-engine-manager --example managed_package_smoke --
          target/ag-psd-managed/${{ matrix.label }}/manifest-${{ matrix.label }}.json
          target/ag-psd-managed/${{ matrix.label }}/yu-engine-ag-psd-31.0.2-node22.23.3.yu2-${{ matrix.label }}.zip
          fixtures/psd/upstream/psd-tools/2layers.psd

      - name: Prepare existing Windows failure capture for this package job
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -B - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root = Path('target/package-acceptance-windows').resolve()
          for phase in ('controls', 'debug', 'release'):
              for kind in ('traces', 'occupancy'):
                  (root / phase / kind).mkdir(parents=True, exist_ok=False)
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, timeout=30).strip()
          context = {'schema_version':'1', 'source_commit':source,
                     'run_id':os.environ['GITHUB_RUN_ID'], 'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                     'runner_image':os.environ.get('ImageVersion'), 'public_release_ready':False,
                     'historical_failure_attributed':False, 'failed_case_retries':0,
                     'capture_timing':'after_failed_command_before_test_root_teardown'}
          (root / 'context.json').write_text(json.dumps(context, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('YU_TEST_FORENSICS_PYTHON=' + sys.executable + '\n')
          PY

      - name: Verify held-file uninstall preserves installation and captured failure
        if: runner.os == 'Windows'
        shell: bash
        env:
          YU_TEST_FORENSICS_DIR: ${{ github.workspace }}/target/package-acceptance-windows/controls/occupancy
        run: |
          set -o pipefail
          cargo test --locked -p yu-cli --test psd removal_contract -- --nocapture 2>&1 | tee target/package-acceptance-windows/controls/tests.log

      - name: Exercise real PSD CLI with no system Node and sanitized Node environment
        shell: bash
        env:
          YU_TEST_MANIFEST: ${{ github.workspace }}/target/ag-psd-managed/${{ matrix.label }}/manifest-${{ matrix.label }}.json
          YU_TEST_PACKAGE: ${{ github.workspace }}/target/ag-psd-managed/${{ matrix.label }}/yu-engine-ag-psd-31.0.2-node22.23.3.yu2-${{ matrix.label }}.zip
          YU_TEST_FORENSICS_DIR: ${{ runner.os == 'Windows' && format('{0}/target/package-acceptance-windows/debug/occupancy', github.workspace) || '' }}
          YU_WINDOWS_LIFECYCLE_TRACE_DIR: ${{ runner.os == 'Windows' && format('{0}/target/package-acceptance-windows/debug/traces', github.workspace) || '' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            set -o pipefail
            cargo test --locked -p yu-cli --test psd_managed -- --ignored --nocapture 2>&1 | tee target/package-acceptance-windows/debug/tests.log
          else
            cargo test --locked -p yu-cli --test psd_managed -- --ignored --nocapture
          fi

      - name: Build and verify isolated CLI developer candidate
        run: >-
          python -B tools/build_cli_candidate.py
          --target ${{ matrix.rust_target }}
          --output-dir target/cli-candidate/${{ matrix.label }}

      - name: Run PSD and ten-cycle lifecycle acceptance against extracted release binary
        shell: bash
        env:
          YU_TEST_CLI: ${{ github.workspace }}/target/cli-candidate/${{ matrix.label }}/smoke/bin/${{ matrix.binary_name }}
          YU_TEST_MANIFEST: ${{ github.workspace }}/target/ag-psd-managed/${{ matrix.label }}/manifest-${{ matrix.label }}.json
          YU_TEST_PACKAGE: ${{ github.workspace }}/target/ag-psd-managed/${{ matrix.label }}/yu-engine-ag-psd-31.0.2-node22.23.3.yu2-${{ matrix.label }}.zip
          YU_TEST_FORENSICS_DIR: ${{ runner.os == 'Windows' && format('{0}/target/package-acceptance-windows/release/occupancy', github.workspace) || '' }}
          YU_WINDOWS_LIFECYCLE_TRACE_DIR: ${{ runner.os == 'Windows' && format('{0}/target/package-acceptance-windows/release/traces', github.workspace) || '' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            set -o pipefail
            cargo test --locked -p yu-cli --test psd_managed -- --ignored --nocapture 2>&1 | tee target/package-acceptance-windows/release/tests.log
          else
            cargo test --locked -p yu-cli --test psd_managed -- --ignored --nocapture
          fi

      - name: Record observed Windows package and executable hashes even on failure
        if: ${{ always() && runner.os == 'Windows' }}
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('target/package-acceptance-windows')
          if root.is_dir():
              paths = [Path('target/debug/yu.exe'), Path('target/cli-candidate/windows-x86_64/smoke/bin/yu.exe'),
                       Path('target/cli-candidate/windows-x86_64/smoke/build-info.json')]
              paths += list(Path('target/ag-psd-managed/windows-x86_64').glob('*'))
              observations = {}
              for path in paths:
                  if path.is_file():
                      with path.open('rb') as stream:
                          observations[path.as_posix()] = hashlib.file_digest(stream, 'sha256').hexdigest()
              report = {'schema_version':'1', 'phase':'after_acceptance_attempt', 'sha256':observations,
                        'missing_file_is_not_execution_evidence':True, 'public_release_ready':False}
              (root / 'observed-inputs.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Retain Windows package acceptance logs and same-invocation snapshots
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/package-acceptance-windows/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload validated CLI developer candidate (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: yu-cli-candidate-${{ matrix.label }}
          path: |
            target/cli-candidate/${{ matrix.label }}/*.zip
            target/cli-candidate/${{ matrix.label }}/SHA256SUMS
            target/cli-candidate/${{ matrix.label }}/candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload managed engine package
        uses: actions/upload-artifact@v4
        with:
          name: ag-psd-managed-package-${{ matrix.label }}
          path: |
            target/ag-psd-managed/${{ matrix.label }}/yu-engine-ag-psd-31.0.2-node22.23.3.yu2-${{ matrix.label }}.zip
            target/ag-psd-managed/${{ matrix.label }}/manifest-${{ matrix.label }}.json
          if-no-files-found: error

      - name: Upload package metadata
        uses: actions/upload-artifact@v4
        with:
          name: ag-psd-managed-metadata-${{ matrix.label }}
          path: target/ag-psd-managed/${{ matrix.label }}/metadata-${{ matrix.label }}.json
          if-no-files-found: error

  manifest:
    name: assemble prototype manifest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v5
        with:
          pattern: ag-psd-managed-metadata-*
          path: target/ag-psd-managed-metadata
          merge-multiple: true

      - name: Assemble three-target Engine Manifest v1
        run: >-
          python tools/build_ag_psd_managed_package.py assemble
          --metadata target/ag-psd-managed-metadata/metadata-*.json
          --output target/ag-psd-managed-manifest-v1.json

      - name: Upload prototype manifest
        uses: actions/upload-artifact@v4
        with:
          name: ag-psd-managed-manifest-v1
          path: target/ag-psd-managed-manifest-v1.json
          if-no-files-found: error
