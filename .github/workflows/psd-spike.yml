name: PSD Spike

on:
  pull_request:
    paths:
      - "crates/yu-psd-spike/**"
      - "fixtures/psd/**"
      - "docs/data/psd-candidate-comparison-v1.json"
      - "docs/data/psd-benchmark-plan-v1.json"
      - "docs/data/psd-benchmark-suite-v2.json"
      - "docs/data/psd-benchmarks/**"
      - ".github/workflows/psd-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psd-tools-reference:
    name: psd-tools reference / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned reference runtime
        run: python -m pip install --disable-pip-version-check "psd-tools==1.20.0"
      - name: Verify pinned reference runtime
        run: python -c "import sys; from psd_tools.version import __version__; assert sys.version_info[:2] == (3, 12); assert __version__ == '1.20.0'; print(f'Python {sys.version_info.major}.{sys.version_info.minor} / psd-tools {__version__}')"
      - name: Run psd-tools corpus conformance
        env:
          YU_PSD_TOOLS_PYTHON: python
        run: cargo test -p yu-psd-spike psd_tools_reference_matches_committed_corpus -- --ignored --nocapture


  rawpsd-candidate:
    name: rawpsd candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run rawpsd candidate corpus report
        run: cargo test -p yu-psd-spike rawpsd_candidate_runs_committed_corpus_without_harness_errors -- --nocapture


  ag-psd-candidate:
    name: ag-psd candidate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned TypeScript candidate runtime
        working-directory: crates/yu-psd-spike/adapters/typescript
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify pinned TypeScript candidate runtime
        working-directory: crates/yu-psd-spike/adapters/typescript
        run: node -e "const p=require('ag-psd/package.json'); if (process.versions.node.split('.')[0] !== '22') process.exit(1); if (p.version !== '31.0.2') process.exit(1); console.log('Node ' + process.versions.node + ' / ag-psd ' + p.version)"
      - name: Run ag-psd candidate corpus report
        env:
          YU_TYPESCRIPT_PSD_NODE: node
        run: cargo test -p yu-psd-spike ag_psd_candidate_matches_committed_corpus -- --ignored --nocapture


  benchmark-contract:
    name: benchmark contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned psd-tools runtime
        run: python -m pip install --disable-pip-version-check "psd-tools==1.20.0"
      - name: Install pinned ag-psd runtime
        working-directory: crates/yu-psd-spike/adapters/typescript
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run benchmark and layer-export contract
        env:
          YU_PSD_TOOLS_PYTHON: python
          YU_TYPESCRIPT_PSD_NODE: node
        run: cargo run -p yu-psd-spike -- benchmark fixtures/psd/corpus.json docs/data/psd-benchmark-plan-v1.json target/psd-benchmark-report.json
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: psd-benchmark-${{ runner.os }}
          path: target/psd-benchmark-report.json
          if-no-files-found: error


  representative-benchmark-suite:
    name: representative benchmark suite / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned psd-tools runtime
        run: python -m pip install --disable-pip-version-check "psd-tools==1.20.0"
      - name: Install pinned ag-psd runtime
        working-directory: crates/yu-psd-spike/adapters/typescript
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run representative benchmark suite
        env:
          YU_PSD_TOOLS_PYTHON: python
          YU_TYPESCRIPT_PSD_NODE: node
        run: cargo run -p yu-psd-spike -- benchmark-suite docs/data/psd-benchmark-suite-v2.json target/psd-benchmark-suite-v2.json
      - name: Upload representative benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: psd-benchmark-representative-ubuntu
          path: target/psd-benchmark-suite-v2.json
          if-no-files-found: error
